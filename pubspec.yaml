name: serial_monitor
description: "Linux için ASCII ve HEX destekli seri port monitörü."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  blue_terminal_lib:
    path: libs/blue_terminal_lib
  shared_preferences: ^2.5.6
  xterm: ^4.0.0
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_pty: ^0.4.2
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  equatable: ^2.1.0
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/ubuntu_mono/LICENSE.txt
  fonts:
    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/ubuntu_mono/UbuntuMono-R.ttf
        - asset: assets/fonts/ubuntu_mono/UbuntuMono-B.ttf
          weight: 700
        - asset: assets/fonts/ubuntu_mono/UbuntuMono-RI.ttf
          style: italic
        - asset: assets/fonts/ubuntu_mono/UbuntuMono-BI.ttf
          weight: 700
          style: italic