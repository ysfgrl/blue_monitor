// Android-only Gradle 9 compatibility for flutter_libserialport 0.6.0.
// Source files and the CMake project remain in the original package directory.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'org.sigrok.flutter_libserialport'
version = '0.6.0'

android {
    namespace 'org.sigrok.flutter_libserialport'
    compileSdk 36
    ndkVersion '28.2.13676358'

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }

    externalNativeBuild {
        cmake {
            path file('libserialport/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
